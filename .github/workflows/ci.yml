name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Unit tests (all packages, cross-platform) ─────────────────────────────
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}

      - name: go vet
        run: go vet ./...

      - name: go test (unit, -race)
        shell: bash
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.25'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage.out

  # ── Benchmark smoke ────────────────────────────────────────────────────────
  # Run each benchmark once to catch panics and allocation regressions.
  benchmark-smoke:
    name: Benchmark smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"

      - name: go test -bench (mock)
        run: |
          if [ -d mock ]; then
            go test -bench=. -benchtime=1x -benchmem -run=^$ ./mock/...
          else
            echo "::notice::mock/ not yet in repo — skipping benchmark smoke"
          fi

  # ── Short fuzz run ────────────────────────────────────────────────────────
  # Runs each fuzz target for 10 s to catch obvious regressions.
  fuzz-short:
    name: Fuzz (short, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"

      - name: Clear fuzz corpus cache
        run: go clean -fuzzcache

      - name: FuzzDecode (codec)
        run: |
          if [ -d codec ] && grep -qr FuzzDecode codec/ 2>/dev/null; then
            go test -fuzz=^FuzzDecode$ -fuzztime=10s ./codec/...
          else
            echo "::notice::FuzzDecode not yet in repo — skipping"
          fi

      - name: FuzzEncodeRoundTrip (codec)
        run: |
          if [ -d codec ] && grep -qr FuzzEncodeRoundTrip codec/ 2>/dev/null; then
            go test -fuzz=^FuzzEncodeRoundTrip$ -fuzztime=10s ./codec/...
          else
            echo "::notice::FuzzEncodeRoundTrip not yet in repo — skipping"
          fi

      - name: FuzzCall (mock)
        run: |
          if [ -d mock ] && grep -qr FuzzCall mock/ 2>/dev/null; then
            go test -race -fuzz=^FuzzCall$ -fuzztime=10s ./mock/...
          else
            echo "::notice::FuzzCall not yet in repo — skipping"
          fi

  # ── Integration test against UDP loopback (optional) ─────────────────────
  test-udp:
    name: Integration (UDP loopback, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"

      - name: Check prerequisites
        id: prereqs
        run: |
          if [ ! -d udp ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::udp/ not yet in repo — skipping integration tests"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: go test (integration, UDP)
        if: steps.prereqs.outputs.available == 'true'
        run: go test -tags integration -v -timeout 30s ./udp/...

  # ── go generate check ─────────────────────────────────────────────────────
  generate:
    name: go generate check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
      - name: go generate
        run: go generate ./...
      - name: Diff check (generated files must be committed)
        run: git diff --exit-code

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m

  # ── go-FuSa safety gate ────────────────────────────────────────────────────
  # Pinned to v0.48.0. The full x-FuSa lifecycle (RELAY spec §20.1.2), not a
  # subset: check (gate on ERROR — WARN/INFO findings are reported but do not
  # fail the build), 100% requirement traceability (traced AND tested),
  # cybersecurity analysis, dependency vulnerability scan, and the tool
  # qualification suite.
  gofusa:
    name: go-FuSa safety check (v0.48.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
      - name: Install go-FuSa
        run: go install github.com/SoundMatt/go-FuSa/cmd/gofusa@v0.48.0
      - name: gofusa check
        run: gofusa check ./...
      - name: Requirement traceability (100% traced + tested)
        run: gofusa trace -req-coverage 100 -sec-tested 100
      - name: Cybersecurity analysis (CYBER001–CYBER020)
        run: gofusa cyber
      - name: Dependency vulnerability scan (OSV / ISO 21434 §8.5)
        run: gofusa vuln
      - name: Tool qualification suite
        run: gofusa qualify

  # ── RELAY conformance gate ─────────────────────────────────────────────────
  # Validates the go-someip CLI version/capabilities/status output against the
  # RELAY §12 JSON schemas embedded in the relay binary (spec v2.0, stable),
  # and that convert (§11.2) produces output equivalent to the reference
  # conversion (relay interop, §20.1.2 item 3).
  relay-conform:
    name: RELAY conform (spec v2.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
      - name: Install relay CLI
        run: go install github.com/SoundMatt/RELAY/v2/cmd/relay@v2.0.4
      - name: Build go-someip CLI
        run: go build -o /tmp/go-someip ./cmd/go-someip
      - name: relay conform
        run: relay conform --strict /tmp/go-someip
      - name: relay interop
        run: relay interop --protocol SOMEIP --strict /tmp/go-someip
